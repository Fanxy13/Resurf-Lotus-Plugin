name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin tests on macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Get Lotus
        run: git clone --depth 1 https://github.com/Fanxy13/homebrew-lotus "$RUNNER_TEMP/lotus"

      - name: Run the tests
        run: zsh tests/run.zsh "$RUNNER_TEMP/lotus"

  game:
    name: The game on a Mac, with the mod
    runs-on: macos-15
    permissions:
      contents: write   # on main: the mod it built and tested goes into mod/ResurfMod.dll
    steps:
      - uses: actions/checkout@v5

      - name: Get Lotus
        run: git clone --depth 1 https://github.com/Fanxy13/homebrew-lotus "$RUNNER_TEMP/lotus"

      # in case GitHub's API turns the runner's unauthenticated requests down
      - name: The game's releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/cyberillcbutsmarter/subway-surfers-resurferd/releases?per_page=30' \
            -o "$RUNNER_TEMP/releases.json" || true
          jq -r '.[] | .tag_name + ": " + ([.assets[].name] | join(", "))' "$RUNNER_TEMP/releases.json" | head -10 || true

      - name: Get the game, build the mod, play twice
        env:
          # on main: installed the way everyone installs it, from this repository on GitHub
          RESURF_INSTALL: ${{ github.ref == 'refs/heads/main' && format('https://github.com/{0}', github.repository) || '' }}
          RESURF_RELEASES: ${{ runner.temp }}/releases.json
          RESURF_OUT: ${{ runner.temp }}/out
        run: |
          dotnet --list-sdks || true
          set +e
          zsh tests/game.zsh "$RUNNER_TEMP/lotus"
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "::warning::No release of the game has a Mac build yet – lotus surf builds one with Unity on your Mac."
            exit 0
          fi
          exit $rc

      - name: Keep the game's logs and the mod
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: game-and-mod
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

      - name: The mod it built and tested, into the repository
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          new="$RUNNER_TEMP/out/ResurfMod.dll"
          if [ ! -f "$new" ]; then echo "No mod was built."; exit 0; fi
          if cmp -s "$new" mod/ResurfMod.dll; then echo "mod/ResurfMod.dll is the one built from this source."; exit 0; fi
          cp "$new" mod/ResurfMod.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod/ResurfMod.dll
          git commit -m "mod/ResurfMod.dll: built from ${GITHUB_SHA::7} against the game's own libraries, tested in the game"
          git pull --rebase origin main && git push origin HEAD:main
